name: ci

# Minimal, unprivileged CI for the Windows host adapter.
# - Source build + protocol/safety tests on Linux and Windows runners.
# - On Windows only the NON-interactive ("pure") native tests can run; live UI
#   observation tests are opt-in (TOADAID_NATIVE_OBSERVATION_TESTS=1) and are
#   never enabled here. No secrets, no elevation, no browsers, no live agents.
# - Dependencies: installed with `npm ci --include=dev` from the committed,
#   reviewed package-lock.json (see docs/CI.md and docs/DEPENDENCY_LOCK.md;
#   the git-sourced capability package is pinned by commit, not by integrity).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Environment
        shell: bash
        run: |
          node --version
          npm --version
          echo "NODE_ENV=${NODE_ENV:-<unset>}"
          echo "TOADAID_NATIVE_OBSERVATION_TESTS=${TOADAID_NATIVE_OBSERVATION_TESTS:-<unset>}"

      - name: Install dependencies from the committed lockfile (dev dependencies explicit)
        shell: bash
        run: npm ci --include=dev

      - name: Lockfile unchanged by install
        shell: bash
        run: git diff --exit-code -- package-lock.json

      - name: Installed dependency tree (for review)
        shell: bash
        run: npm ls --all || true

      - name: Build
        shell: bash
        run: npm run build

      - name: Tests (live desktop observation is never enabled on CI)
        shell: bash
        env:
          TOADAID_NATIVE_OBSERVATION_TESTS: ""
          TOADAID_NATIVE_CSHARP_WORKER: ""
        run: npm test
